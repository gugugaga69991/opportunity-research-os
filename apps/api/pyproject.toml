[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-api"
version = "0.1.0"
description = "Opportunity Research OS API and worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2", "arq>=0.26,<1", "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1", "httpx>=0.28,<1", "pgvector>=0.4,<1", "croniter>=6,<7",
  "pydantic-settings>=2.10,<3", "python-json-logger>=3.3,<4",
  "sqlalchemy[asyncio]>=2.0.40,<3", "tzdata>=2025.2", "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
