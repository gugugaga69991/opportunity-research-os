name: Research cycle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: opportunity-research-cycle
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_REDDIT_ACTOR_ID: ${{ secrets.APIFY_REDDIT_ACTOR_ID }}
      APIFY_WEB_COLLECTOR_ACTOR_ID: ${{ secrets.APIFY_WEB_COLLECTOR_ACTOR_ID }}
      APIFY_RESEARCH_ACTOR_ID: ${{ secrets.APIFY_RESEARCH_ACTOR_ID }}
      APIFY_WEBHOOK_SECRET: ${{ secrets.APIFY_WEBHOOK_SECRET }}
      APIFY_WEBHOOK_URL: ${{ secrets.APIFY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install .
      - run: alembic upgrade head
      - run: python -m opportunity_api.jobs --max-jobs 200
