services:
  - type: web
    name: opportunity-research-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn opportunity_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_REDDIT_ACTOR_ID
        sync: false
      - key: APIFY_WEB_COLLECTOR_ACTOR_ID
        sync: false
      - key: APIFY_RESEARCH_ACTOR_ID
        sync: false
      - key: APIFY_WEBHOOK_SECRET
        generateValue: true
      - key: APIFY_WEBHOOK_URL
        sync: false
